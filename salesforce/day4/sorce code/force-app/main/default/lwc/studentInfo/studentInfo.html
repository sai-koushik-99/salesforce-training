<!-- 
    FILE: studentInfo.html
    PURPOSE: Displays student information using data binding.
    Data binding means the values shown here come directly from 
    JavaScript variables — not hardcoded in HTML.
-->
<template>

    <!-- 
        slds-card → plain SLDS CSS class that styles a div as a card.
        Avoids the lightning-card component which can cause double rendering
        when placed on Lightning App Pages via App Builder.
    -->
    <div class="slds-card">

        <!-- Card Header -->
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure slds-media__figure_fixed-width">
                    <!-- lightning-icon: graduation cap icon for student context -->
                    <lightning-icon icon-name="standard:education" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <!-- Card title -->
                    <h2 class="slds-card__header-title">
                        <span>Student Information</span>
                    </h2>
                </div>
            </header>
        </div>

        <!-- Card Body -->
        <div class="slds-card__body slds-card__body_inner">

            <!-- Page Heading -->
            <h1 class="slds-text-heading_medium slds-m-bottom_large">
                🎓 Student Details
            </h1>

            <!-- Student Name Row -->
            <div class="slds-grid slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <span class="slds-text-title_caps slds-text-color_weak">
                        Student Name
                    </span>
                </div>
                <!-- {studentName} → data binding from studentInfo.js -->
                <div class="slds-col slds-size_2-of-3">
                    <span class="slds-text-body_regular">{studentName}</span>
                </div>
            </div>

            <!-- Roll Number Row -->
            <div class="slds-grid slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <span class="slds-text-title_caps slds-text-color_weak">
                        Roll Number
                    </span>
                </div>
                <!-- {rollNumber} → data binding from studentInfo.js -->
                <div class="slds-col slds-size_2-of-3">
                    <span class="slds-text-body_regular">{rollNumber}</span>
                </div>
            </div>

            <!-- Department Row -->
            <div class="slds-grid slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <span class="slds-text-title_caps slds-text-color_weak">
                        Department
                    </span>
                </div>
                <!-- {department} → data binding from studentInfo.js -->
                <div class="slds-col slds-size_2-of-3">
                    <span class="slds-text-body_regular">{department}</span>
                </div>
            </div>

            <!-- Update Button -->
            <div class="slds-m-top_medium">
                <!-- onclick={handleUpdateInfo} → calls JS method on click -->
                <lightning-button
                    label="Update Student Info"
                    variant="brand"
                    onclick={handleUpdateInfo}>
                </lightning-button>
            </div>

            <!-- 
                Confirmation badge — only shown after button click.
                lwc:if={isUpdated} → added to DOM only when isUpdated = true in JS.
            -->
            <div lwc:if={isUpdated} class="slds-m-top_medium">
                <lightning-badge label={updateMessage}></lightning-badge>
            </div>

        </div>
        <!-- End: Card Body -->

    </div>

</template>
